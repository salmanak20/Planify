name: planify_app
description: "Planify - All-in-One Productivity App: Notes, Tasks, Calendar & Workspace"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Local database and preferences
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Firebase backend
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: 6.2.1
  http: ^1.6.0

  # Calendar and reminders
  table_calendar: ^3.1.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  lottie: ^3.1.2
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  firebase_core_platform_interface: ^6.0.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/sounds/ambient/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
